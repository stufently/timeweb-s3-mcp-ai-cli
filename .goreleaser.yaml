version: 2
project_name: timeweb-s3
builds:
  - id: timeweb-s3
    main: ./cmd/timeweb-s3
    binary: timeweb-s3
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}
archives:
  - id: binaries
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, README.en.md]
checksum:
  name_template: checksums.txt
changelog:
  disable: true
